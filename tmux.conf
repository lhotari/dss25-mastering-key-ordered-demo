# Project-local tmux configuration for the DSS25 demo.
# Sourced by `just demo` after tmuxp creates the session.
# Original: https://gist.github.com/lhotari/bb3253f1ea05de52f14c0b223cbfd8a6#appendix-example-tmuxconf

# Performance
set -sg escape-time 10
set -g history-limit 50000
set -g focus-events on

# Display
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB:title"
set -as terminal-overrides ",tmux-256color:title"
set -g display-time 3000
set -g mouse on
set -g allow-passthrough on

# Window naming
setw -g automatic-rename off
set -g allow-rename on
set -g status-interval 2
set -g window-status-format "  #I:#{=-28:pane_title} "
set -g window-status-current-format " *#I:#{=-28:pane_title} "
set -g status-right " %H:%M %d-%b-%y "

# Pass titles to outer terminal (Ghostty / iTerm2)
set -g set-titles on
set -g set-titles-string "#T"

# Pane border shows full path
set -g pane-border-status top
set -g pane-border-format " #{pane_current_path} "

# Clipboard
set -g set-clipboard on

# Word separators
set -g word-separators " -_@"

# Click a pane to focus it WITHOUT forwarding the click event to the program
# inside. The default binding is `select-pane -t = \; send-keys -M`, where the
# trailing `send-keys -M` forwards the mouse event and can trigger a bell from
# the shell or app receiving it. We only do `select-pane` here.
bind -n MouseDown1Pane select-pane -t =
